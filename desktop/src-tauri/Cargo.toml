[package]
name = "flacify"
version = "2.0.0"
description = "Flacify — High-Fidelity Lossless Audio Downloader & Library Studio"
authors = ["Flacify Contributors"]
edition = "2021"

[lib]
name = "flacify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
